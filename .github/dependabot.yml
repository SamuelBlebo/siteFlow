# Weekly pull requests for dependency updates. Each one runs the full CI before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates together; majors one at a time (they may need code changes)
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Expo SDK fixes the exact versions of React, React Native and every native module, and
      # web and mobile share one install, so these only change together in a planned Expo SDK
      # upgrade (`npx expo install --fix`), never one at a time
      - dependency-name: expo
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-firebase/*'
      - dependency-name: '@react-native-community/*'
      - dependency-name: '@react-native-async-storage/*'
      - dependency-name: '@react-navigation/*'
      # The test runner and its coverage plugin must stay on the same major
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/*'
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /firebase/functions
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types follow the functions runtime (Node 22); TypeScript majors are planned upgrades
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
