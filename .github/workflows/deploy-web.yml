# Deploys the web app, Cloud Functions and rules to Firebase.
# develop -> siteflow-dev, main -> siteflow-prod
name: Deploy web and backend
on:
  push:
    branches: [main, develop]
    paths: ['apps/web/**', 'packages/shared/**', 'firebase/**', 'firebase.json']

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm --prefix firebase/functions ci
      - name: Write web environment file
        run: |
          cat > apps/web/.env.production <<ENV
          VITE_FB_API_KEY=${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN=${{ secrets.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID=${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_FB_STORAGE_BUCKET=${{ secrets.VITE_FB_STORAGE_BUCKET }}
          VITE_FB_MESSAGING_SENDER_ID=${{ secrets.VITE_FB_MESSAGING_SENDER_ID }}
          VITE_FB_APP_ID=${{ secrets.VITE_FB_APP_ID }}
          ENV
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy
        run: npx firebase-tools deploy --project ${{ github.ref_name == 'main' && 'prod' || 'dev' }} --non-interactive --force
