# Deploys the web app, Cloud Functions and rules to Firebase.
# Manual only for now: nothing deploys automatically, and production is never deployed
# without someone choosing it here. Automatic dev deploys come with the CI/CD stage,
# once the Firebase projects and secrets exist.
# The web build (firebase.json predeploy -> scripts/build-web.mjs) refuses to build for the wrong project.
name: Deploy web and backend
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Firebase project
        type: choice
        options: [dev, prod]
        default: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'prod' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm --prefix firebase/functions ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # The web and app config are public project identifiers: fetched from the chosen project,
      # so there is nothing to copy into GitHub secrets and dev can't get prod's config.
      - name: Fetch Firebase config for ${{ inputs.target }}
        run: node scripts/fetch-firebase-config.mjs ${{ inputs.target }}
      - name: Check configuration
        run: node scripts/check-env.mjs ${{ inputs.target }}
      - name: Deploy
        run: npx firebase-tools deploy --project ${{ inputs.target }} --non-interactive
