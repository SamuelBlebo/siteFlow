# Deploys the web app, Cloud Functions and rules to Firebase.
# Manual only for now: nothing deploys automatically, and production is never deployed
# without someone choosing it here. Automatic dev deploys come with the CI/CD stage,
# once the Firebase projects and secrets exist.
name: Deploy web and backend
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Firebase project
        type: choice
        options: [dev, prod]
        default: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'prod' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm --prefix firebase/functions ci
      - name: Write web environment file
        run: |
          cat > apps/web/.env.production <<ENV
          VITE_FB_API_KEY=${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN=${{ secrets.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID=${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_FB_STORAGE_BUCKET=${{ secrets.VITE_FB_STORAGE_BUCKET }}
          VITE_FB_MESSAGING_SENDER_ID=${{ secrets.VITE_FB_MESSAGING_SENDER_ID }}
          VITE_FB_APP_ID=${{ secrets.VITE_FB_APP_ID }}
          ENV
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy
        run: npx firebase-tools deploy --project ${{ inputs.target }} --non-interactive
